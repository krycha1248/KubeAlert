name: Terragrunt Deployment

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      action:
        description: 'Terragrunt action to run'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - init
      image_tag:
        description: 'Docker image tag (e.g. v1.0.0, leave empty for latest Git tag)'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      action:
        description: 'Terragrunt action to run'
        required: false
        default: 'apply'
        type: string
      image_tag:
        description: 'Docker image tag to deploy (leave empty for latest Git tag)'
        required: false
        default: ''
        type: string
    secrets:
      ENV_SECRETS:
        required: false

concurrency:
  group: terraform-state-lock
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  terragrunt:
    name: Terragrunt Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Load, mask and export ENV_SECRETS
        env:
          ENV_SECRETS: ${{ secrets.ENV_SECRETS }}
        run: |
          while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue

            if [[ "$line" != *"="* ]]; then
              continue
            fi

            key="${line%%=*}"
            value="${line#*=}"

            key="$(echo -n "$key" | xargs)"

            if [ -n "$value" ]; then
              echo "::add-mask::$value"
            fi

            delimiter="EOF_$(openssl rand -hex 8)"
            echo "$key<<$delimiter" >> "$GITHUB_ENV"
            echo "$value" >> "$GITHUB_ENV"
            echo "$delimiter" >> "$GITHUB_ENV"
          done <<< "$ENV_SECRETS"

      - name: Resolve and Export Image Tag for Terragrunt
        run: |
          IMAGE_TAG="${{ inputs.image_tag }}"

          # If image_tag is empty or "latest", resolve the latest Git tag from repository
          if [ -z "$IMAGE_TAG" ] || [ "$IMAGE_TAG" = "latest" ]; then
            git fetch --tags --force 2>/dev/null || true
            LATEST_TAG=$(git tag -l --sort=-v:refname | head -n 1)
            if [ -n "$LATEST_TAG" ]; then
              echo "No explicit tag provided, resolved latest Git tag: $LATEST_TAG"
              IMAGE_TAG="$LATEST_TAG"
            else
              echo "No Git tags found in repository, fallback to 'latest'"
              IMAGE_TAG="latest"
            fi
          else
            echo "Using specified image tag: $IMAGE_TAG"
          fi

          echo "Final image tag for deployment: $IMAGE_TAG"
          echo "TF_VAR_app_image_tag=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "TF_VAR_image_tag=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "APP_IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Set lowercase repository name
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REPO_LOWER=${REPO_LOWER}" >> "$GITHUB_ENV"

      - name: Check if image exists in GitHub Container Registry
        run: |
          IMAGE_NAME="ghcr.io/${{ env.REPO_LOWER }}:${{ env.APP_IMAGE_TAG }}"
          echo "Checking if image exists: $IMAGE_NAME"
          if docker manifest inspect "$IMAGE_NAME" > /dev/null 2>&1; then
            echo "Image exists."
          else
            echo "Image does not exist."
            return 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: Setup Terragrunt
        uses: gruntwork-io/terragrunt-action@8c1d96b76d445fd2e41475a3f0b63dcd1d9cc077
        with:
          tg_version: 1.1.0
          tofu_version: 1.12.0

      - name: Terragrunt Init
        run: make init

      - name: Terragrunt Plan
        if: github.event_name == 'pull_request' || (inputs.action == 'plan')
        run: make plan

      - name: Terragrunt Apply
        if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || (inputs.action == 'apply')
        run: make apply
