name: Terragrunt Destroy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type "DESTROY" to confirm infrastructure destruction'
        required: true
        type: string

jobs:
  terragrunt-destroy:
    name: Terragrunt Destroy
    runs-on: ubuntu-latest

    steps:
      - name: Verify Confirmation
        run: |
          if [ "${{ inputs.confirmation }}" != "DESTROY" ]; then
            echo "::error::Invalid confirmation ('${{ inputs.confirmation }}'). Expected 'DESTROY'."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load, mask and export ENV_SECRETS
        env:
          ENV_SECRETS: ${{ secrets.ENV_SECRETS }}
        run: |
          while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue

            if [[ "$line" != *"="* ]]; then
              continue
            fi

            key="${line%%=*}"
            value="${line#*=}"

            key="$(echo -n "$key" | xargs)"

            if [ -n "$value" ]; then
              echo "::add-mask::$value"
            fi

            delimiter="EOF_$(openssl rand -hex 8)"
            echo "$key<<$delimiter" >> "$GITHUB_ENV"
            echo "$value" >> "$GITHUB_ENV"
            echo "$delimiter" >> "$GITHUB_ENV"
          done <<< "$ENV_SECRETS"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: Setup Terragrunt
        uses: gruntwork-io/terragrunt-action@8c1d96b76d445fd2e41475a3f0b63dcd1d9cc077
        with:
          tg_version: 1.1.0
          tofu_version: 1.12.0    

      - name: Terragrunt Init
        run: make init

      - name: Terragrunt Destroy
        run: make destroy
