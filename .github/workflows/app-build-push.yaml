name: App Build and Release

on:
  push:
    branches:
      - master
    paths:
      - 'app/**'
      - '.github/workflows/app-*'
      - '.releaserc*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: app-semantic-release
  cancel-in-progress: false

jobs:
  verify-image-build:
    name: Verify Docker Image Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Test build Docker image (dry run without push)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          tags: kubealert-app:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max

  semantic-release-and-publish:
    name: Semantic Release & Publish Image
    needs: verify-image-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full history for semantic-release)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Run Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@16ca923e6ccbb50770c415a0ccd43709a8c5f7a4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Log in to GitHub Container Registry
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository name
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REPO_LOWER=${REPO_LOWER}" >> "$GITHUB_ENV"

      - name: Build and push Docker image with semantic release tag
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_LOWER }}:v${{ steps.semantic.outputs.new_release_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
